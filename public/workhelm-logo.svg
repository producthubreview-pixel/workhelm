<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="helm-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="helm-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  
  <!-- Hard hat icon -->
  <g transform="translate(60, 60)">
    <!-- Helmet dome -->
    <path d="M-28 8 C-28 -16 -18 -28 0 -28 C18 -28 28 -16 28 8" 
          stroke="url(#helm-shine)" stroke-width="5" stroke-linecap="round" fill="url(#helm-grad)"/>
    <!-- Helmet brim -->
    <path d="M-40 8 C-40 2 -20 0 0 0 C20 0 40 2 40 8" 
          stroke="url(#helm-shine)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Helmet brim extended -->
    <line x1="-38" y1="8" x2="-34" y2="8" stroke="url(#helm-shine)" stroke-width="4" stroke-linecap="round"/>
    <!-- Center ridge -->
    <line x1="0" y1="-28" x2="0" y2="2" stroke="url(#helm-shine)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- WorkHelm text -->
  <text x="140" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#1E293B" letter-spacing="-0.5">
    Work<tspan fill="#2563EB">Helm</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="140" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" letter-spacing="2" text-transform="uppercase">
    FOLLOW UP. CLOSE MORE.
  </text>
</svg>
